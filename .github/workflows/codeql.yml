# CodeQL SAST. Analyzes the TypeScript sources and the workflow YAML itself
# (via the `actions` language pack).
#
# Trigger posture: gate pull requests into main, scan every main update, and
# sweep weekly even during quiet periods. Manual dispatch remains available for
# incident response and verification — reach for it when you need a full-tree
# scan, because the pull_request run is diff-informed and only reasons about the
# code the PR touches.
name: codeql

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '37 9 * * 2'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    permissions:
      contents: read
      security-events: write
      actions: read # required on private repos: codeql-action reads its own workflow-run metadata
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          languages: ${{ matrix.language }}
      # Code scanning is not enabled on this private repo (no GitHub Advanced Security), so the
      # SARIF-upload API is unavailable and `analyze` fails outright with "Code scanning is not
      # enabled for this repository". Write the SARIF locally and gate on it ourselves instead —
      # there is no code-scanning dashboard to review, so the gate step below IS the enforcement.
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          category: '/language:${{ matrix.language }}'
          upload: never
          output: sarif-results
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Fail on error-severity findings
        run: node scripts/codeql-gate.mjs sarif-results
