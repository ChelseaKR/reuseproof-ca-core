# Scheduled full-history secret scan, over every result tier TruffleHog
# reports. gitleaks runs at commit time via
# .pre-commit-config.yaml; this is the periodic sweep of the *entire* commit
# history with a different engine and its own detector set, catching anything a
# diff-scoped scan by construction cannot (a secret introduced and later removed
# in the same PR still shows up in history).
name: trufflehog

on:
  schedule:
    - cron: '0 8 * * 0' # weekly, Sunday, staggered off ci.yml/codeql.yml's crons
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trufflehog-scheduled
  cancel-in-progress: true

jobs:
  scan:
    name: full-history secret scan (all result tiers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
          disable-telemetry: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full clone — this is a whole-history scan, not a diff
          persist-credentials: false
      - name: TruffleHog (full history, all result tiers)
        uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          path: ./
          # Pinned, and it must equal the version comment on the `uses:` line above.
          # The action's `version` input defaults to "latest" and it runs
          # `ghcr.io/trufflesecurity/trufflehog:${VERSION}`, so SHA-pinning the action
          # above does not pin what actually scans. That is how this gate changed
          # behaviour with no commit here: upstream published 3.96.0 and the next
          # run picked it up. Dependabot cannot see this input, so it moved the SHA
          # to v3.97.0 and then v3.97.1 while this stayed at 3.96.0 and the sweep
          # went on running the older image. `npm run check:pins` now fails on that
          # gap instead of leaving it to be noticed.
          version: '3.97.1'
          # `--fail` is not passed. The action's own command already includes it
          # and repeating a flag is a hard CLI error, so this scan exited 1 at
          # startup having read nothing: no chunk count, no findings, no coverage.
          #
          # The tier list is load-bearing. `--only-verified` reports a finding
          # only when TruffleHog asked the provider and the provider said the
          # credential is live. A credential that leaked and was then REVOKED --
          # the normal end state of a real incident, and the exact case a
          # scheduled full-history sweep exists to catch -- answers "no", which
          # TruffleHog files under `unverified`. So the setting this job ran
          # with until 2026-09-06 could not fail on the thing it exists for,
          # and reported success either way.
          #
          # Measured 2026-09-06 on a throwaway clone with a real-shaped AWS key
          # planted in one commit and deleted in the next (confirmed present in
          # history and absent at HEAD first, or the test measures a diff scan
          # rather than a history scan):
          #
          #   --only-verified                        exit 0,   0 reported
          #   --results=verified                     exit 0,   0 reported
          #   --results=verified,unknown             exit 0,   0 reported
          #   --results=verified,unknown,unverified  exit 183, unverified_secrets: 1
          #
          # This repository's whole history was re-scanned under the widened
          # tier on 2026-09-06 with trufflehog 3.97.1 and reported nothing, so
          # widening costs no false positives here and no detector had to be
          # excluded. If a placeholder fixture ever does fire, exclude that
          # DETECTOR by name and never narrow the tier back.
          extra_args: --results=verified,unknown,unverified
