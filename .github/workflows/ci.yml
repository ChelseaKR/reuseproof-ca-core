name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A push to a branch is not a superseded pull-request commit. Keying the group
  # on the ref alone gave every commit on `main` ONE shared slot: GitHub allows
  # one running plus one pending run per group, so a second push cancels the run
  # the first commit was still executing (`cancel-in-progress: true`), and a
  # third push evicts the second from the pending slot (`false`). Either way the
  # commit lands with no verdict at all, and it is reported as `cancelled` or is
  # simply absent -- never as red -- so nothing surfaces it.
  #
  # The discriminator below gives each pushed commit its own slot while leaving
  # pull-request runs grouped per PR, so a superseded PR commit is still
  # cancelled. `cancel-in-progress` is deliberately unchanged.
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          # No npm cache. `release.yml` checks out a commit resolved by its
          # authorize job and runs `make verify` there, and a workflow_dispatch
          # run always carries the default branch's cache scope — so anything
          # that job executes can write an entry this job would later restore.
          # `release.yml` has run cache-free since #18; dropping the restore
          # side too leaves the default branch with no Actions cache for that
          # path to poison at all. See ADR-0010. `npm ci` on this dependency
          # tree costs seconds, and a cache-free install is the more
          # deterministic of the two anyway.
          package-manager-cache: false

      - name: Run the repository merge gate
        run: make verify
