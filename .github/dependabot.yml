version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    open-pull-requests-limit: 5
    groups:
      npm-dependencies:
        patterns: ['*']
    ignore:
      # Keep compiler and ambient Node types on the repository's supported
      # majors. Major upgrades are coordinated with the lint toolchain and
      # .nvmrc instead of being combined into an unresolvable group update.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ['*']
    # No `ignore` entry for the reusable workflow `release.yml` pins any more,
    # and this is the note explaining why the old one is gone rather than a
    # silent deletion.
    #
    # It named ChelseaKR/portfolio-standards, which is *private*, and existed
    # because Dependabot's repo-scoped credentials cannot read a private
    # repository: the proxy logs `403 ... Either the repo doesn't exist, or
    # Dependabot doesn't have access to it`, the updater records
    # `git_dependencies_not_reachable` for that one dependency, and a single
    # recorded error fails the whole weekly run even though every other action
    # was checked. Suppressing the dependency was the cheapest way to stop that,
    # at the cost of never bumping the one pin that authorizes a release.
    #
    # `release.yml` now pins the same workflow in ChelseaKR/.github, which is
    # public, so Dependabot can read it and the suppression would only hide a
    # pin it is now able to check. Every action in this repository is under
    # automatic update again.
    #
    # The move was not a preference. A public repository cannot call a reusable
    # workflow that lives in a private one, so the old pin made `release.yml`
    # unparseable and undispatchable; see the comment on the `authorize` job.
    # Dependabot updater runs are not surfaced through the Actions API, so
    # confirm this under Insights > Dependency graph > Dependabot rather than in
    # the Actions tab.
