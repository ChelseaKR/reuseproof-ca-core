# Local hooks run through the repository's own npm scripts, so the tool versions
# come from package-lock.json and always match `make verify` / CI exactly (no
# separately-pinned mirrors to drift).
# Install with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: prettier-check
        name: prettier (check)
        entry: npm run format:check
        language: system
        pass_filenames: false
      - id: eslint
        name: eslint (zero warnings)
        entry: npm run lint
        language: system
        pass_filenames: false
      - id: hygiene
        name: source-marker hygiene
        entry: npm run hygiene
        language: system
        pass_filenames: false
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
